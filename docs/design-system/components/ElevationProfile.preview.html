<!-- @dsCard group="Plots" height=360 subtitle="Altitude against distance, with summit callout" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<div class="laa" style="padding:24px;background:var(--surface-100)">
  <figure class="laa-chart" style="margin:0">
    <h3 class="laa-chart__title">1,435 m of climbing in 3.4 km</h3>
    <p class="laa-chart__sub">Couvercle hut to the summit · illustrative data</p>
    <svg id="ep" viewBox="0 0 640 220" role="img" aria-label="Elevation profile from 2,687 m to 4,122 m"></svg>
  </figure>
</div>
<script>
(function () {
  var pts = [[0,2687],[0.4,2700],[0.9,2790],[1.4,2960],[1.8,3120],[2.2,3330],[2.5,3560],[2.8,3790],[3.1,3980],[3.4,4122]];
  var W = 640, H = 220, L = 44, R = 16, T = 24, B = 24;
  var x0 = 0, x1 = 3.4, y0 = 2500, y1 = 4250;
  var X = function (v) { return L + (v - x0) / (x1 - x0) * (W - L - R); };
  var Y = function (v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); };
  var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('ep');
  function el(n, a, t) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); if (t) e.textContent = t; svg.appendChild(e); return e; }
  [2500, 3000, 3500, 4000].forEach(function (v) {
    el('line', { 'class': v === 2500 ? 'base' : 'grid', x1: L, x2: W - R, y1: Y(v), y2: Y(v) });
    el('text', { 'class': 'tick', x: L - 8, y: Y(v) + 4, 'text-anchor': 'end' }, v.toLocaleString('en-US'));
  });
  [0, 1, 2, 3].forEach(function (v) { el('text', { 'class': 'tick', x: X(v), y: H - 4, 'text-anchor': 'middle' }, v + ' km'); });
  var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); }).join(' ');
  el('path', { 'class': 'area', d: line + ' L' + X(3.4) + ' ' + Y(2500) + ' L' + X(0) + ' ' + Y(2500) + ' Z' });
  el('path', { 'class': 's1', d: line });
  el('circle', { 'class': 'dot', cx: X(0), cy: Y(2687), r: 4, stroke: 'var(--series-1)' });
  el('text', { 'class': 'lbl-muted', x: X(0) + 2, y: Y(2687) - 16 }, 'Couvercle hut 2,687 m');
  el('circle', { 'class': 'dot', cx: X(3.4), cy: Y(4122), r: 4, stroke: 'var(--series-1)' });
  el('text', { 'class': 'peak', x: X(3.4) - 8, y: Y(4122) - 4, 'text-anchor': 'end' }, '4,122 m');
})();
</script>
