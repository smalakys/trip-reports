<!-- @dsCard group="Plots" height=380 subtitle="Expedition high point vs sleeping altitude by day" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<div class="laa" style="padding:24px;background:var(--surface-100)">
  <figure class="laa-chart" style="margin:0">
    <h3 class="laa-chart__title">Climbed high, slept low: summit on day 16</h3>
    <p class="laa-chart__sub">Daily high point and sleeping altitude · illustrative data</p>
    <svg id="ac" viewBox="0 0 640 240" role="img" aria-label="Acclimatisation profile over 18 days"></svg>
  </figure>
</div>
<script>
(function () {
  var hi =    [4100,4100,4600,4400,5300,5300,4400,4100,5900,6100,6100,4400,4100,4100,6100,7495,6100,4100];
  var sleep = [4100,4100,4100,4100,4100,5300,4100,4100,4100,5900,6100,4100,4100,4100,5900,6100,4400,4100];
  var W = 640, H = 240, L = 44, R = 64, T = 24, B = 26, n = hi.length;
  var y0 = 3500, y1 = 8000;
  var X = function (i) { return L + i / (n - 1) * (W - L - R); };
  var Y = function (v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); };
  var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('ac');
  function el(t, a, s) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); if (s) e.textContent = s; svg.appendChild(e); return e; }
  [3500, 5000, 6500, 8000].forEach(function (v) {
    el('line', { 'class': v === 3500 ? 'base' : 'grid', x1: L, x2: W - R, y1: Y(v), y2: Y(v) });
    el('text', { 'class': 'tick', x: L - 8, y: Y(v) + 4, 'text-anchor': 'end' }, v.toLocaleString('en-US'));
  });
  [0, 4, 9, 14, 17].forEach(function (i) { el('text', { 'class': 'tick', x: X(i), y: H - 4, 'text-anchor': 'middle' }, 'Day ' + (i + 1)); });
  function path(a) { return a.map(function (v, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' '); }
  el('path', { 'class': 'area', d: path(hi) + ' L' + X(n - 1) + ' ' + Y(y0) + ' L' + X(0) + ' ' + Y(y0) + ' Z' });
  el('path', { 'class': 's2', d: path(sleep) });
  el('path', { 'class': 's1', d: path(hi) });
  el('circle', { 'class': 'dot', cx: X(15), cy: Y(7495), r: 4, stroke: 'var(--series-1)' });
  el('text', { 'class': 'peak', x: X(15), y: Y(7495) - 10, 'text-anchor': 'middle' }, '7,495 m');
  el('text', { 'class': 'lbl', x: W - R + 8, y: Y(hi[n - 1]) - 8, fill: 'var(--series-1)' }, 'High point');
  el('text', { 'class': 'lbl', x: W - R + 8, y: Y(sleep[n - 1]) + 16, fill: 'var(--series-2)' }, 'Slept');
})();
</script>
