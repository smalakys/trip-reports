# Page, image and plot settings. Colours, type, spacing and radii come from
# assets/design/tokens.json (the LAA design system); override a token colour here with
# [colors] name = "#hex" if a trip needs it.

mode = "light"          # "light" or "dark": which token theme to render

[page]
width_mm         = 210
height_mm        = 297
margin_left_mm   = 20   # text column = 175 mm
margin_right_mm  = 15
margin_top_mm    = 31   # chapter titles sit 32 mm from the top edge
margin_bottom_mm = 22

[text]
justify = true

[images]
cover_long_edge_px = 2800
photo_long_edge_px = 2200
jpeg_quality       = 84

[plots]
dpi = 300
