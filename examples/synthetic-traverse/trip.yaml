  - {file: photos/sunrise-col.jpg, size: half, caption: {lt: Saulėtekis ant perėjos., en: Sunrise on the col.}}
  - {file: photos/ausros-virsune.jpg, size: half, caption: {lt: Aušros viršūnė., en: Aušros viršūnė.}}
