[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripreports"
version = "0.1.0"
description = "Publication-ready mountaineering trip reports from a trip file, a GPX track and photos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typst>=0.13",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.11",
  "gpxpy>=1.6",
  "pydantic>=2.6",
  "pyyaml>=6",
  "pillow>=10",
]

[project.optional-dependencies]
tiles = ["contextily>=1.5"]
dev = ["pytest>=8", "pypdf>=4", "ruff>=0.5"]

[project.scripts]
tripreport = "tripreports.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tripreports"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "E731"]
